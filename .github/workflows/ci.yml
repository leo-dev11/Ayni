name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt

      - name: Dependencias del sistema (LightGBM y OpenMP)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgomp1

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Lint
        run: ruff check src tests

      - name: Formato
        run: ruff format --check src tests

      - name: Tests
        run: pytest -q

      # Ningún test necesita el dataset de Kaggle: se construyen con datos sintéticos
      # y con el Booster diminuto de tests/test_api.py. Por eso no hay paso de descarga.
