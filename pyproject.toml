[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ayni"
version = "0.1.0"
description = "Scoring de riesgo crediticio: modelo explicable, decisión por costo y monitoreo de drift."
requires-python = ">=3.13"
# Las dependencias se fijan en requirements.txt (fuente única de verdad).
dependencies = []

[project.scripts]
ayni = "ayni.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
